<!DOCTYPE html>
<html>

<head>
<title>Admin Login</title>

<style>

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f4f4;
}

.login{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.3);
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:#2196f3;
color:white;
border:none;
}

</style>

</head>

<body>

<div class="login">

<h2>Admin Login</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

const u=document.getElementById("user").value
const p=document.getElementById("pass").value

if(u==="admin" && p==="1234"){

localStorage.setItem("admin","true")

window.location="admin.html"

}else{

alert("Wrong login")

}

}

</script>

</body>
</html>
