<!DOCTYPE html>
<html>
<head>

<title>Bus Tracker Admin</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f7f7f7;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#2196f3,#4caf50);
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

/* MAIN */

.container{
padding:20px;
}

/* BUTTONS */

button{
padding:6px 14px;
margin:6px;
font-size:14px;
cursor:pointer;
border:none;
background:#2196f3;
color:white;
border-radius:6px;
}

button:hover{
background:#1976d2;
}

/* MAP */

#map{
height:420px;
margin-top:20px;
border-radius:10px;
}

/* DASHBOARD */

#dashboard{
display:flex;
gap:15px;
margin-bottom:20px;
}

.card{
flex:1;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.2);
text-align:center;
font-size:18px;
}

/* LIST ITEMS */

.item{
background:white;
padding:8px;
margin-bottom:6px;
border-radius:6px;
box-shadow:0 2px 5px rgba(0,0,0,0.15);
display:flex;
justify-content:space-between;
align-items:center;
}

.section{
margin-top:20px;
}
.logoutBtn{
position:absolute;
right:20px;
top:12px;
background:#f44336;
padding:6px 12px;
border-radius:6px;
}

.logoutBtn:hover{
background:#d32f2f;
}
</style>

</head>

<body>

<div class="header">
🚌 Bus Tracker Admin Dashboard
<button onclick="logout()" class="logoutBtn">Logout</button>
</div>

<div class="container">

<h3>Dashboard</h3>

<div id="dashboard">

<div class="card">
Total Stops<br>
<span id="stopCount">0</span>
</div>

<div class="card">
Total Buses<br>
<span id="busCount">0</span>
</div>

<div class="card">
Online Buses<br>
<span id="onlineBusCount">0</span>
</div>

</div>

<button onclick="clearStops()">Delete All Stops</button>
<button onclick="reloadStops()">Reload Stops</button>

<div class="section">
<h3>Stops</h3>
<div id="stopList"></div>
</div>

<div class="section">
<h3>Buses</h3>
<div id="busList"></div>
</div>

<div id="map"></div>

</div>

<script>

/* ADMIN SECURITY */

if(localStorage.getItem("admin") !== "true"){
alert("Please login as admin");
window.location="admin-login.html";
}

/* MAP */

var map = L.map('map').setView([16.7333,82.2167],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

/* CLICK MAP TO ADD STOP */

map.on("click", function(e){

const stopName = prompt("Enter Stop Name:");

if(!stopName) return;

fetch("/add-stop",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name:stopName,
lat:e.latlng.lat,
lng:e.latlng.lng
})
})
.then(res=>res.json())
.then(()=>{
alert("Stop added");
loadStops();
});

});

var busMarkers = {};
var stopMarkers = {};
var routeLine = null;

/* SMOOTH BUS MOVEMENT */

function animateMarker(marker, newLatLng){

const start = marker.getLatLng();

const frames = 20;
let frame = 0;

const deltaLat = (newLatLng.lat - start.lat) / frames;
const deltaLng = (newLatLng.lng - start.lng) / frames;

const interval = setInterval(()=>{

frame++;

const lat = start.lat + deltaLat * frame;
const lng = start.lng + deltaLng * frame;

marker.setLatLng([lat,lng]);

if(frame >= frames){
clearInterval(interval);
marker.setLatLng(newLatLng);
}

},50);

}

/* DISTANCE CALCULATION */

function getDistance(lat1, lon1, lat2, lon2){

const R = 6371;

const dLat = (lat2-lat1) * Math.PI/180;
const dLon = (lon2-lon1) * Math.PI/180;

const a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2) *
Math.sin(dLon/2);

const c = 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

/* BUS ICON */

var busIcon = L.icon({
iconUrl: "bus.png",
iconSize: [36,36],
iconAnchor: [18,18],
popupAnchor: [0,-18]
});

/* DELETE ALL STOPS */

function clearStops(){

fetch("/clear-stops",{method:"POST"})
.then(res=>res.json())
.then(()=>{
alert("All stops deleted");
loadStops();
});

}

/* LOAD STOPS */

function loadStops(){

fetch("/stops")
.then(res=>res.json())
.then(stops=>{

document.getElementById("stopCount").innerText = stops.length;

const list=document.getElementById("stopList");

list.innerHTML="";

Object.values(stopMarkers).forEach(marker=>{
map.removeLayer(marker);
});

stopMarkers={};

var routeCoords=[];

stops.forEach(stop=>{

routeCoords.push([stop.lat,stop.lng]);

const item=document.createElement("div");
item.className="item";

item.innerHTML=
stop.name+
"<button onclick='deleteStop(\""+stop._id+"\")'>Delete</button>";

list.appendChild(item);

const marker = L.marker([stop.lat,stop.lng])
.addTo(map)
.bindPopup(stop.name + "<br>🚌 Calculating ETA...");

marker.stopName = stop.name;

stopMarkers[stop._id]=marker;

});

/* ROUTE LINE */

if(routeLine){
map.removeLayer(routeLine);
}

if(routeCoords.length>1){

routeLine=L.polyline(routeCoords,{
color:"blue",
weight:4
}).addTo(map);

}

});

}

/* DELETE STOP */

function deleteStop(id){

fetch("/delete-stop/"+id,{method:"DELETE"})
.then(res=>res.text())
.then(msg=>{
alert(msg);
loadStops();
});

}

/* LOAD BUSES */

function loadBuses(){

fetch("/buses")
.then(res=>res.json())
.then(buses=>{

document.getElementById("busCount").innerText=buses.length;

let onlineCount=0;

const list=document.getElementById("busList");

list.innerHTML="";

buses.forEach(bus=>{

const item=document.createElement("div");
item.className="item";

const lastUpdate=new Date(bus.lastUpdated);
const now=new Date();

const diff=(now-lastUpdate)/1000;

let status="🔴 Offline";

if(diff<30){
status="🟢 Online";
onlineCount++;
}

item.innerHTML=
bus.busName+" "+status+
"<button onclick='deleteBus(\""+bus._id+"\")'>Delete</button>";

list.appendChild(item);

/* BUS MARKER */

if(!busMarkers[bus._id]){

busMarkers[bus._id]=L.marker([bus.lat,bus.lng],{icon:busIcon})
.addTo(map)
.bindPopup(bus.busName);

}else{

animateMarker(busMarkers[bus._id], L.latLng(bus.lat,bus.lng));

}

});

document.getElementById("onlineBusCount").innerText=onlineCount;

});

}

/* DELETE BUS */

function deleteBus(id){

fetch("/delete-bus/"+id,{method:"DELETE"})
.then(res=>res.text())
.then(msg=>{
alert(msg);
loadBuses();
});

}

/* LIVE BUS MOVEMENT */

function loadLiveBuses(){

fetch("/buses")
.then(res=>res.json())
.then(buses=>{

buses.forEach(bus=>{

if(!busMarkers[bus._id]){

busMarkers[bus._id]=L.marker([bus.lat,bus.lng],{icon:busIcon})
.addTo(map)
.bindPopup(bus.busName);

}else{

animateMarker(busMarkers[bus._id], L.latLng(bus.lat,bus.lng));

}

/* ETA UPDATE */

Object.keys(stopMarkers).forEach(id=>{

const stopMarker = stopMarkers[id];

const stopLatLng = stopMarker.getLatLng();

const distance = getDistance(
bus.lat,
bus.lng,
stopLatLng.lat,
stopLatLng.lng
);

const speed = 30;

let eta = Math.round((distance/speed)*60);

if(eta < 1) eta = 1;
if(eta > 60) eta = ">60";

stopMarker.setPopupContent(
stopMarker.stopName + "<br>🚌 Bus arriving in " + eta + " min"
);

});

});

});

}

/* RELOAD */

function reloadStops(){

loadStops();
loadBuses();

}
function logout(){

localStorage.removeItem("admin");

alert("Logged out");

window.location = "admin-login.html";

}

/* START */

window.onload=()=>{

loadStops();
loadBuses();

setInterval(loadLiveBuses,2000);
setInterval(loadBuses,5000);

}

</script>

</body>
</html>
