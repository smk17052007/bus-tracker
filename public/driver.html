<!DOCTYPE html>
<html>

<head>

<title>Bus Driver GPS</title>

<style>

body{
font-family:Arial;
text-align:center;
padding:40px;
}

button{
padding:12px 20px;
font-size:16px;
}

#status{
margin-top:20px;
font-size:18px;
}

</style>

</head>

<body>

<h2>Driver GPS Tracker</h2>

<p>Enter Bus Name</p>

<input id="busName" placeholder="Bus1">

<br><br>

<button onclick="startTracking()">Start Tracking</button>

<div id="status">Waiting...</div>

<script>

let tracking = false;

function startTracking(){

const busName = document.getElementById("busName").value;

if(!busName){
alert("Enter Bus Name");
return;
}

tracking = true;

document.getElementById("status").innerText="Tracking started...";

setInterval(()=>{

if(!tracking) return;

navigator.geolocation.getCurrentPosition(pos=>{

const lat = pos.coords.latitude;
const lng = pos.coords.longitude;

fetch("/update-location",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
busName:busName,
lat:lat,
lng:lng
})

});

document.getElementById("status").innerText=
"Sending location: "+lat.toFixed(5)+", "+lng.toFixed(5);

});

},2000);

}

</script>

</body>

</html>
