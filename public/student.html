<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2196f3">

<title>College Bus Tracker</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

#header{
background:#2196f3;
color:white;
padding:12px;
font-size:20px;
text-align:center;
font-weight:bold;
}

/* BUS CONTROL */

#controls{
background:white;
padding:10px;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

/* STOP LIST */

#stopList{
background:white;
padding:8px;
max-height:120px;
overflow:auto;
font-size:14px;
border-bottom:1px solid #ddd;
}

/* MAP AREA */

#map{
flex:1;
}

/* PANEL */

#panel{
background:white;
padding:15px;
border-top-left-radius:20px;
border-top-right-radius:20px;
box-shadow:0 -3px 10px rgba(0,0,0,0.3);
}

/* TEXT */

.bigText{
font-size:22px;
font-weight:bold;
}

.infoRow{
margin-top:5px;
font-size:18px;
}

/* LOCATE BUTTON */

#locateBtn{

position:absolute;

right:15px;
bottom:120px;

background:#2196f3;
color:white;

width:45px;
height:45px;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;

border-radius:50%;

cursor:pointer;

box-shadow:0 3px 8px rgba(0,0,0,0.3);

z-index:1000;

}
</style>

</head>

<body>

<div id="header">
🚌 College Bus Tracker
</div>

<div id="controls">

<label>Select Bus:</label>

<select id="busSelect">
<option value="ALL">All Buses</option>
</select>

</div>

<div id="stopList"></div>

<div id="map"></div>

<div id="locateBtn">📍</div>

<div id="panel">

<div class="bigText">
Next Stop: <span id="nextStop">--</span>
</div>

<div class="infoRow">
ETA: <span id="eta">--</span>
</div>

<div class="infoRow">
Status: <span id="status">Waiting...</span>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>

/* -----------------------
MAP INITIALIZATION
----------------------- */

const map = L.map("map").setView([16.5062,80.6480],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

/* -----------------------
SOCKET CONNECTION
----------------------- */

const socket = io();

socket.on("connect", () => {
console.log("Socket connected:", socket.id);
});

socket.on("disconnect", () => {
console.log("Socket disconnected");
});

/* -----------------------
DATA STORAGE
----------------------- */

let stopsData = [];
let stopMarkers = [];
let busMarkers = {};
let lastPositions = {};
let lastMoveTime = {};

/* -----------------------
LOAD STOPS
----------------------- */

fetch("/stops")
.then(res=>res.json())
.then(stops=>{

stopsData = stops;

const list=document.getElementById("stopList");

stops.forEach((stop,index)=>{

const marker = L.circleMarker(
[stop.lat,stop.lng],
{
radius:8,
color:"blue",
fillColor:"blue",
fillOpacity:1
})
.addTo(map)
.bindPopup(stop.name);

stopMarkers.push(marker);

/* ADD TO STOP LIST */

const item=document.createElement("div");

item.innerText=(index+1)+". "+stop.name;

item.style.padding="4px";

list.appendChild(item);

});

});

/* -----------------------
HAVERSINE DISTANCE
----------------------- */

function distance(lat1,lon1,lat2,lon2){

const R = 6371;

const dLat = (lat2-lat1) * Math.PI/180;
const dLon = (lon2-lon1) * Math.PI/180;

const a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

/* -----------------------
NEXT STOP DETECTION
----------------------- */

function getNextStop(busLat,busLng){

let closest=null;
let min=Infinity;

stopsData.forEach(stop=>{

const d = distance(busLat,busLng,stop.lat,stop.lng);

if(d<min){
min=d;
closest=stop;
}

});

return closest;

}

/* -----------------------
BUS DIRECTION
----------------------- */

function getBearing(lat1,lng1,lat2,lng2){

const dLon = (lng2-lng1) * Math.PI/180;

lat1 = lat1 * Math.PI/180;
lat2 = lat2 * Math.PI/180;

const y = Math.sin(dLon) * Math.cos(lat2);
const x =
Math.cos(lat1)*Math.sin(lat2)-
Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);

let brng = Math.atan2(y,x);

brng = brng * 180/Math.PI;

return (brng + 360) % 360;

}

/* -----------------------
SMOOTH MOVEMENT
----------------------- */

function animateMarker(marker,newLat,newLng){

const start = marker.getLatLng();

const startLat = start.lat;
const startLng = start.lng;

const steps = 15;
let i = 0;

const deltaLat = (newLat - startLat) / steps;
const deltaLng = (newLng - startLng) / steps;

const interval = setInterval(()=>{

i++;

const lat = startLat + deltaLat * i;
const lng = startLng + deltaLng * i;

marker.setLatLng([lat,lng]);

if(i>=steps){
clearInterval(interval);
}

},60);

}

/* -----------------------
BUS MOVEMENT EVENT
----------------------- */

socket.on("bus-moved",(location)=>{

const busName = location.busName;

const select = document.getElementById("busSelect");

if(!Array.from(select.options).some(o=>o.value===busName)){

const option = document.createElement("option");
option.value = busName;
option.text = busName;

select.appendChild(option);

}

const selectedBus = select.value;

if(selectedBus !== "ALL" && selectedBus !== busName){
return;
}

const lat = Number(location.lat);
const lng = Number(location.lng);

let rotation = 0;

if(lastPositions[busName]){

const last = lastPositions[busName];

rotation = getBearing(
last.lat,
last.lng,
lat,
lng
);

}

lastPositions[busName] = {lat,lng};

lastMoveTime[busName]=Date.now();

/* BUS ICON */

const busIcon = L.divIcon({
html:`<img src="/images/bus.png"
style="width:40px;transform:rotate(${rotation}deg);">`,
iconSize:[40,40],
className:""
});

/* CREATE OR UPDATE */

if(!busMarkers[busName]){

busMarkers[busName] =
L.marker([lat,lng],{icon:busIcon})
.addTo(map)
.bindPopup(busName);

}
else{

busMarkers[busName].setIcon(busIcon);

}

animateMarker(busMarkers[busName],lat,lng);

map.panTo([lat,lng]);

document.getElementById("status").innerText="Moving 🟢";

/* NEXT STOP */

const nextStop = getNextStop(lat,lng);

if(nextStop){

let nextIndex = stopsData.findIndex(
s => s.name === nextStop.name
);

stopMarkers.forEach((marker,index)=>{

if(index < nextIndex){

marker.setStyle({color:"green",fillColor:"green"});

}
else if(index === nextIndex){

marker.setStyle({color:"yellow",fillColor:"yellow"});

}
else{

marker.setStyle({color:"blue",fillColor:"blue"});

}

});

document.getElementById("nextStop").innerText = nextStop.name;

const dist = distance(
lat,
lng,
nextStop.lat,
nextStop.lng
);

const speed = 30;

let eta = Math.round((dist/speed)*60);

if(eta<1) eta=1;

document.getElementById("eta").innerText = eta+" min";

}

});

/* BUS WAITING DETECTOR */

setInterval(()=>{

const select=document.getElementById("busSelect");
const bus=select.value;

if(bus==="ALL") return;

if(!lastMoveTime[bus]) return;

const diff=(Date.now()-lastMoveTime[bus])/1000;

if(diff>10){

document.getElementById("status").innerText="Waiting 🔴";

}

},3000);

/* LOCATE BUTTON */

document.getElementById("locateBtn").onclick=function(){

const select=document.getElementById("busSelect");

const bus=select.value;

if(bus==="ALL" || !busMarkers[bus]){
alert("Select a bus first");
return;
}

map.panTo(busMarkers[bus].getLatLng());

};

/* SERVICE WORKER */

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("/sw.js")
.then(()=>{

console.log("Service Worker Registered");

});

}

</script>

</body>
</html>
