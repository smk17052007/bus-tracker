<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Bus Tracker</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>

<style>
body { margin:0; padding:0; background:#e0e0e0;}
#map { height:100vh; width:100vw;}

#infoBox{
position:absolute;
top:10px;
left:10px;
background:white;
padding:10px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.3);
z-index:1000;
font-family:Arial;
}
</style>
</head>

<body>

<div id="infoBox">
Next Stop: <span id="nextStop">Calculating...</span><br>
ETA: <span id="eta">--</span>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>

let stopsData = [];
let lastPositions = {};

/* -----------------------------
   Map Initialization
------------------------------*/

const map = L.map('map').setView([16.5062,80.6480],14);

/* -----------------------------
   Passenger Mode
------------------------------*/

const isAdmin = false;

/* -----------------------------
   Map Tiles
------------------------------*/

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19,
attribution:'© OpenStreetMap'
}).addTo(map);

/* -----------------------------
   Socket Connection
------------------------------*/

const socket = io();

socket.on("connect", ()=>{
console.log("Socket connected:", socket.id);
});

/* -----------------------------
   Bus Markers
------------------------------*/

const markers = {};

function animateMarker(marker,newLat,newLng){

const start = marker.getLatLng();

const startLat = start.lat;
const startLng = start.lng;

const steps = 20;
let i = 0;

const deltaLat = (newLat - startLat) / steps;
const deltaLng = (newLng - startLng) / steps;

const interval = setInterval(()=>{

i++;

const lat = startLat + deltaLat * i;
const lng = startLng + deltaLng * i;

marker.setLatLng([lat,lng]);

if(i >= steps){
clearInterval(interval);
}

},50);

}

/* -----------------------------
   Load Stops
------------------------------*/

fetch("/stops")
.then(res=>res.json())
.then(stops=>{

stopsData = stops;

const routeCoordinates = [];

stops.forEach(stop=>{

L.marker([stop.lat,stop.lng])
.addTo(map)
.bindPopup(stop.name);

routeCoordinates.push([stop.lat,stop.lng]);

});

/* Draw route */

L.polyline(routeCoordinates,{
color:"blue",
weight:4
}).addTo(map);

});

/* -----------------------------
   Distance (Haversine)
------------------------------*/

function distance(lat1,lon1,lat2,lon2){

const R = 6371;

const dLat = (lat2-lat1) * Math.PI/180;
const dLon = (lon2-lon1) * Math.PI/180;

const a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2);

const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

/* -----------------------------
   Find Next Stop
------------------------------*/

function getNextStop(busLat,busLng){

let closestStop=null;
let minDistance=Infinity;

stopsData.forEach(stop=>{

const d = distance(busLat,busLng,stop.lat,stop.lng);

if(d<minDistance){
minDistance=d;
closestStop=stop;
}

});

return closestStop;

}

/* -----------------------------
   Calculate Direction
------------------------------*/

function getBearing(lat1,lng1,lat2,lng2){

const dLon = (lng2-lng1) * Math.PI/180;

lat1 = lat1 * Math.PI/180;
lat2 = lat2 * Math.PI/180;

const y = Math.sin(dLon) * Math.cos(lat2);
const x =
Math.cos(lat1)*Math.sin(lat2)-
Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);

let brng = Math.atan2(y,x);

brng = brng * 180/Math.PI;

return (brng + 360) % 360;

}

/* -----------------------------
   Bus Movement Listener
------------------------------*/

socket.on("bus-moved",(location)=>{

const lat = Number(location.lat);
const lng = Number(location.lng);

let rotation = 0;

if(lastPositions[location.busName]){

const last = lastPositions[location.busName];

rotation = getBearing(
last.lat,
last.lng,
lat,
lng
);

}

lastPositions[location.busName] = {lat,lng};

const busIcon = L.divIcon({
html:`<img src="bus.png"
style="width:40px;transform:rotate(${rotation}deg);">`,
iconSize:[40,40],
className:""
});

if(!markers[location.busName]){

markers[location.busName] =
L.marker([lat,lng],{icon:busIcon})
.addTo(map);

}else{

markers[location.busName].setIcon(busIcon);

}

animateMarker(
markers[location.busName],
lat,
lng
);

map.panTo([lat,lng]);

/* ETA Calculation */

const nextStop = getNextStop(lat,lng);

if(nextStop){

document.getElementById("nextStop").innerText = nextStop.name;

const dist = distance(
lat,
lng,
nextStop.lat,
nextStop.lng
);

const speed = 30;

let etaMinutes = Math.round((dist/speed)*60);

if(etaMinutes < 1) etaMinutes = 1;

document.getElementById("eta").innerText = etaMinutes+" min";

}

});

</script>

</body>
</html>
